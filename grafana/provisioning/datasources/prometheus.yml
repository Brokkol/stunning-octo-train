apiVersion: 1

# Убираем источники, созданные вручную, чтобы не было конфликта имён
deleteDatasources:
  - name: prometheus
    orgId: 1
  - name: Prometheus
    orgId: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
