services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: go_app
    restart: always
    expose:
      - "8080"
    environment:
      - MONGO_URI=mongodb://mongo:27017
      - MONGO_DB=app_db
      - REDIS_ADDR=redis:6379
      - S3_ENDPOINT=http://s3:8333
      - S3_REGION=us-east-1
      - S3_BUCKET=images
      - AWS_ACCESS_KEY_ID=local
      - AWS_SECRET_ACCESS_KEY=local
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
    depends_on:
      - mongo
      - redis
      - s3
      - rabbitmq
    networks:
      - app-network

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: go_worker
    restart: always
    command: ["./worker"]
    environment:
      - MONGO_URI=mongodb://mongo:27017
      - MONGO_DB=app_db
      - REDIS_ADDR=redis:6379
      - S3_ENDPOINT=http://s3:8333
      - S3_REGION=us-east-1
      - S3_BUCKET=images
      - AWS_ACCESS_KEY_ID=local
      - AWS_SECRET_ACCESS_KEY=local
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
    depends_on:
      - mongo
      - redis
      - s3
      - rabbitmq
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    networks:
      - app-network

  mongo:
    image: mongo:6.0
    container_name: mongo_db
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    container_name: redis_cache
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app-network

  s3:
    image: chrislusf/seaweedfs
    container_name: seaweed_s3
    restart: always
    command: server -dir=/data -s3 -s3.port=8333
    ports:
      - "8333:8333"   # S3 API
      - "9333:9333"   # веб-страница статуса SeaweedFS
    volumes:
      - s3_data:/data
    networks:
      - app-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq_broker
    restart: always
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # веб-панель (guest / guest)
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - app-network
  
  prometheus:
    image: prom/prometheus
    container_name: prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - app-network

  grafana:
    image: grafana/grafana
    container_name: grafana
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - app-network
networks:
  app-network:
    driver: bridge

volumes:
  mongo_data:
  redis_data:
  s3_data:
  rabbitmq_data:
  prometheus_data:
  grafana_data:
