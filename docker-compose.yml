services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: go_app
    restart: always
    expose:
      - "8080"
    environment:
      - MONGO_URI=mongodb://mongo:27017
      - MONGO_DB=app_db
      - REDIS_ADDR=redis:6379
      - S3_ENDPOINT=http://s3:8333
      - S3_REGION=us-east-1
      - S3_BUCKET=images
      - AWS_ACCESS_KEY_ID=local
      - AWS_SECRET_ACCESS_KEY=local
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
    depends_on:
      - mongo
      - redis
      - s3
      - rabbitmq
    networks:
      - app-network

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: go_worker
    restart: always
    command: ["./worker"]
    environment:
      - MONGO_URI=mongodb://mongo:27017
      - MONGO_DB=app_db
      - REDIS_ADDR=redis:6379
      - S3_ENDPOINT=http://s3:8333
      - S3_REGION=us-east-1
      - S3_BUCKET=images
      - AWS_ACCESS_KEY_ID=local
      - AWS_SECRET_ACCESS_KEY=local
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
    depends_on:
      - mongo
      - redis
      - s3
      - rabbitmq
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    networks:
      - app-network

  mongo:
    image: mongo:6.0
    container_name: mongo_db
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    container_name: redis_cache
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app-network

  s3:
    image: chrislusf/seaweedfs
    container_name: seaweed_s3
    restart: always
    command: server -dir=/data -s3 -s3.port=8333
    ports:
      - "8333:8333"   # S3 API
      - "9333:9333"   # веб-страница статуса SeaweedFS
    volumes:
      - s3_data:/data
    networks:
      - app-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq_broker
    restart: always
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # веб-панель (guest / guest)
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - app-network
  
  prometheus:
    image: prom/prometheus
    container_name: prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - app-network

  grafana:
    image: grafana/grafana
    container_name: grafana
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - app-network

  redis_exporter:
    image: oliver006/redis_exporter
    container_name: redis_exporter
    environment:
      - REDIS_ADDR=redis://redis:6379
    networks:
      - app-network

  mongo_exporter:
    image: percona/mongodb_exporter:0.40
    container_name: mongo_exporter
    command:
      - --mongodb.uri=mongodb://mongo:27017
      - --collect-all
    networks:
      - app-network

  node_exporter:
    image: prom/node-exporter
    container_name: node_exporter
    networks:
      - app-network
  
  vector:
    image: timberio/vector:0.43.1-alpine
    container_name: vector
    volumes:
      - ./vector/vector.yml:/etc/vector/vector.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - s3
    networks:
      - app-network

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    mem_limit: 1g
    volumes:
      - es_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    networks:
      - app-network

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.3
    container_name: kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    mem_limit: 1g
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    networks:
      - app-network

  logstash:
    image: docker.elastic.co/logstash/logstash:8.15.3
    volumes:
      - ./logstash/pipeline.conf:/usr/share/logstash/pipeline/logstash.conf:ro
    environment:
      - LS_JAVA_OPTS=-Xms256m -Xmx256m
      - XPACK_MONITORING_ENABLED=false
    mem_limit: 768m
    depends_on:
      - elasticsearch
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mongo_data:
  redis_data:
  s3_data:
  rabbitmq_data:
  prometheus_data:
  grafana_data:
  es_data: