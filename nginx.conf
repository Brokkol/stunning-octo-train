events {
    worker_connections 1024;
}

http {
    server {
        listen 80;

        # По умолчанию Nginx пропускает тела запросов только до 1 МБ
        client_max_body_size 20M;

        # Разрешаем браузеру ходить к API с другого адреса (Flutter Web работает на своём порту)
        add_header Access-Control-Allow-Origin * always;

        # /metrics только для Prometheus (он ходит прямо в app:8080), снаружи закрыт
        location = /metrics {
            return 404;
        }

        location / {
            resolver 127.0.0.11 valid=10s;
            set $upstream http://app:8080;
            proxy_pass $upstream;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
