input {
  tcp {
    port => 5044
    codec => json_lines
    ecs_compatibility => disabled
  }
}

filter {
  mutate { remove_field => ["host", "port", "@version"] }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "logs-%{+YYYY.MM.dd}"
  }

  if [level] == "ERROR" {
    http {
      url => "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"
      http_method => "post"
      format => "json"
      mapping => {
        "chat_id" => "${TELEGRAM_CHAT_ID}"
        "text" => "Mini Imgur ERROR: %{msg}"
      }
    }
  }
}