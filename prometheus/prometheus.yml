global:
  scrape_interval: 15s

scrape_configs:
  - job_name: app
    static_configs:
      - targets: ["app:8080"]
  - job_name: worker
    static_configs:
      - targets: ["worker:2112"]
  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]
  - job_name: redis
    static_configs:
      - targets: ["redis_exporter:9121"]
  - job_name: mongo
    static_configs:
      - targets: ["mongo_exporter:9216"]
  - job_name: node
    static_configs:
      - targets: ["node_exporter:9100"]